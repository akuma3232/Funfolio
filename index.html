<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="icon" href="assets/icon.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- Entry screen — first thing visible on load -->
    <div id="entry-screen">
      <div id="entry-symbol"></div>
      <div id="entry-hint">click or press space to enter</div>
      <div id="entry-loader"></div>
    </div>

    <div id="main-content">

      <!-- Hidden SVG filter for the name interference effect.
           JS changes the seed every 40ms to animate it. -->
      <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="name-filter" x="-10%" y="-20%" width="120%" height="140%">
            <feTurbulence id="name-turb" type="turbulence"
              baseFrequency="0.008 1.1" numOctaves="1" seed="1" result="noise" />
            <feDisplacementMap id="name-disp"
              in="SourceGraphic" in2="noise" scale="6"
              xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </defs>
      </svg>

      <!-- Background video — starts (with audio) on entry click -->
      <video id="bg-video" muted loop playsinline>
        <source id="bg-video-source" src="" type="video/mp4" />
      </video>

      <!-- Background particles canvas -->
      <canvas id="bg-canvas"></canvas>

      <!-- Top Controls (Fullscreen only) -->
      <div id="top-controls">
        <button id="fullscreen-btn" aria-label="Toggle fullscreen" title="Toggle fullscreen (F)">⛶</button>
      </div>

      <!-- Top info bar (Live Imperial clock) -->
      <div id="top-info">
        <div id="live-clock" class="top-pill">
          <span class="clock-dot"></span>
          <span id="clock-text">🏰 Imperial Palace • Ruling the Empire • --:--:--</span>
        </div>
      </div>

      <!-- Profile card -->
      <div id="profile-card">

        <!-- 3D Specular glare highlight (follows mouse) -->
        <div id="card-glare"></div>

        <!-- Section 1: avatar + name + status -->
        <div id="profile-main">
          <div id="avatar-wrapper" title="Click for a sparkle surprise! ✨">
            <img id="avatar" src="" alt="avatar" />
            <img id="avatar-decoration" src="" alt="" />
          </div>
          <div id="profile-info">
            <div id="profile-name">
              <div id="name-row">
                <div class="name-wrapper">
                  <span id="name-text"></span>
                  <span class="name-tooltip" id="name-tooltip"></span>
                </div>
                <div id="badges"></div>
              </div>
            </div>
            <p id="profile-status"></p>
          </div>
        </div>

        <!-- Divider -->
        <div class="card-divider"></div>

        <!-- Section 2: Discord presence -->
        <div id="discord-presence">
          <div id="discord-avatar-wrapper">
            <img id="discord-avatar" src="" alt="discord avatar" />
            <span id="discord-status-ring"></span>
            <img id="discord-status-icon" src="" alt="" />
          </div>
          <div id="discord-info">
            <span id="discord-username"></span>
            <span id="discord-activity"></span>
          </div>
          <!-- Animated music equalizer bars -->
          <div id="music-bars" title="Audio playing">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>

        <!-- Section 3: social links (generated from config.js) -->
        <div id="social-links"></div>

      </div>

    </div>

    <!-- Toast notification -->
    <div id="toast"></div>

    <!-- Cursor sparkle trail canvas — above everything -->
    <canvas id="cursor-canvas"></canvas>

    <!-- config.js must load before script.js -->
    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
